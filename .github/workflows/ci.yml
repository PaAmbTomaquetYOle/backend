name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: test
      NEO4J_PASSWORD: test
      KAFKA_CLUSTER_ID: test
      JWT_SECRET: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --group dev

      - run: uv run ruff check .

      - run: uv run pytest
