[project]
name = "slack-agent-backend"
version = "0.1.0"
description = "Backend for the Slack Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.51",
    "pydantic[email]>=2.13.4",
    "PyJWT>=2.13.0",
    "aiokafka>=0.14.0",
    "neo4j>=5.28",
    "mcp>=1.28.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "httpx2>=2.5.0",
    "ruff>=0.15.20",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["src/app"]
branch = true
