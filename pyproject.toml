[project]
name = "slack-agent-backend"
version = "0.1.0"
description = "Backend for the Slack Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.51",
    "pydantic[email]>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.5.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
